- name: allowed-queries
  definition:
    queries:
      - name: langnames
        query: |
          query MyQuery {
            vw_langnames {
              alt
              ang
              cc
              gw
              hc
              lc
              ld
              ln
              lr
              pk
            }
          }
      - name: Consolidated Repos
        query: |
          query Consolidated {
            vw_consolidated_repos {
              language_ietf
              language_name
              repo_url
              title
              language_english_name
              repo_name
              username
            }
          }
