table:
  name: git_repo
  schema: public
object_relationships:
  - name: content
    using:
      foreign_key_constraint_on: content_id
array_relationships:
  - name: git_repo_topics
    using:
      foreign_key_constraint_on:
        column: repo_id
        table:
          name: repo_topic
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - content_id
        - repo_name
        - repo_url
        - username
        - id
      filter: {}
